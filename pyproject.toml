[project]
name = "agentic-procurement-orchestration"
version = "0.1.0"
description = "Human-supervised LangGraph procurement orchestration for financial organizations."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "psycopg[binary]>=3.3,<4.0",
    "langsmith>=0.3.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "streamlit>=1.42",
    "supabase>=2.20,<3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_demo"]
